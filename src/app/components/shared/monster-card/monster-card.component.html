<mat-card class="monster-card" (click)="openDetails()">
  <mat-card-header>
    <mat-card-title>{{ monster.name }}</mat-card-title>
    <mat-card-subtitle>
      <span class="type-badge">{{ creatureTypeName }}</span>
      <app-rarity-label [rarity]="monster.rarity" />
      @if (monster.isCustom) {
        <span class="custom-badge">Custom</span>
      }
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="components">
      @for (item of ingredients; track item.componentTypeId) {
        <mat-chip [matTooltip]="item.effect?.description ?? 'No magical effect'" class="component-chip">
          {{ item.componentTypeName }}
        </mat-chip>
      }
    </div>

    @if (bossDrop) {
      <mat-divider class="drop-divider" />
      <div class="boss-drop-row">
        <span class="drop-label">Unique ingredient:</span>
        <span class="drop-name">{{ bossDrop.name }}</span>
        <div class="drop-counter" (click)="$event.stopPropagation()">
          <button mat-icon-button type="button" [disabled]="bossDropQuantity === 0" (click)="adjustBossDrop(-1, $event)">
            <mat-icon>remove</mat-icon>
          </button>
          <span class="drop-qty" [class.has-qty]="bossDropQuantity > 0">{{ bossDropQuantity }}</span>
          <button mat-icon-button type="button" (click)="adjustBossDrop(1, $event)">
            <mat-icon>add</mat-icon>
          </button>
        </div>
      </div>
    }

  </mat-card-content>

</mat-card>
